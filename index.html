<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – Municipality of Luisiana</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/index.css">
  <link rel="icon" type="image/png" href="images/css_logo.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div class="header-logos">
      <img src="images/bagong_pilipinas_logo.png" alt="Bagong Pilipinas Logo" class="logo">
      <img src="images/luisiana_logo.png" alt="Luisiana Logo" class="logo">
    </div>
    <div class="subtitle">Republika ng Pilipinas <br> Lalawigan ng Laguna <br> Bayan ng Luisiana</div>
    <h3>MUNICIPALITY OF LUISIANA</h3>
    <h1>Admin Login</h1>
    <form id="loginForm">
      <div class="form-group">
        <div class="input-wrapper">
          <i class="fas fa-user input-icon"></i>
          <input type="email" id="email" name="email" placeholder="Email" required autocomplete="off">
        </div>
      </div>
      <div class="form-group">
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="password" name="password" placeholder="Password" required>
          <i class="fas fa-eye-slash password-toggle" id="togglePassword"></i>
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
    </form>
    <div id="errorMessage" class="error-message" style="display: none;">
      <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://ircbidpdgkezxnszzeuu.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlyY2JpZHBkZ2tlenhuc3p6ZXV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MjQ1ODYsImV4cCI6MjA5MjIwMDU4Nn0.OkLuJsyIx1a3AsIb9w7KWEDlyIJfWjQJ9O_fN5KoSMw';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const errorDiv = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');

    togglePassword?.addEventListener('click', function() {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      this.classList.toggle('fa-eye');
      this.classList.toggle('fa-eye-slash');
    });

    function showError(msg) {
      errorText.textContent = msg;
      errorDiv.style.display = 'block';
      setTimeout(() => {
        errorDiv.style.opacity = '0';
        setTimeout(() => {
          errorDiv.style.display = 'none';
          errorDiv.style.opacity = '1';
        }, 300);
      }, 3000);
    }

    loginForm?.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Please enter email and password');
        return;
      }

      const submitBtn = loginForm.querySelector('.btn-login');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Logging in...';
      submitBtn.disabled = true;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email, password
        });

        if (error) throw error;

        const { data: adminCheck } = await supabaseClient
          .from('admin_users')
          .select('*')
          .eq('id', data.user.id)
          .eq('is_active', true)
          .single();

        if (!adminCheck) {
          await supabaseClient.auth.signOut();
          showError('You do not have admin access');
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
          return;
        }

        sessionStorage.setItem('isAdminLoggedIn', 'true');
        sessionStorage.setItem('adminEmail', email);
        sessionStorage.setItem('adminId', data.user.id);

        window.location.href = 'html/dashboard.html';

      } catch (error) {
        showError(error.message || 'Invalid email or password');
        passwordInput.value = '';
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });

    if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
      // window.location.href = 'html/dashboard.html';
    }
  </script>
</body>
</html>
