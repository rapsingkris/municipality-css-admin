<script>
  // Check if user is logged in

    window.location.href = '../index.html';
  }
</script>

<script>
  // Role-based restriction for viewers
  (async function() {
    // Wait for supabaseClient to be ready
    let attempts = 0;
    while (!window.supabaseClient && attempts < 50) {
      await new Promise(resolve => setTimeout(resolve, 100));
      attempts++;
    }

    if (!window.supabaseClient) {
      console.error('supabaseClient not loaded');
      return;
    }

    const sb = window.supabaseClient;

    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return;

      const { data: adminData } = await sb.from('admin_users').select('role').eq('id', session.user.id).single();
      const userRole = adminData?.role || 'viewer';

      sessionStorage.setItem('userRole', userRole);

      // If viewer, hide export button
      if (userRole === 'viewer') {
        document.addEventListener('DOMContentLoaded', () => {
          const exportBtn = document.getElementById('exportBtn');
          if (exportBtn) {
            exportBtn.style.display = 'none';
          }

          // Show viewer banner
          const banner = document.createElement('div');
          banner.style.cssText = 'background: #fef3c7; color: #92400e; padding: 8px 16px; text-align: center; font-size: 13px; border-bottom: 1px solid #fed7aa; position: sticky; top: 0; z-index: 1000;';
          banner.innerHTML = '<i class="fas fa-eye"></i> Viewer Mode — You can view responses but cannot export data';
          document.body.insertBefore(banner, document.body.firstChild);
        });
      }
    } catch (err) {
      console.error('Role check error:', err);
    }
  })();
</script>

<script>
  // Logout functionality
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', function(e) {
