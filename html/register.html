<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Complete Registration - Municipality of Luisiana</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #004aad 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      max-width: 450px;
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #1e293b;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #004aad;
      box-shadow: 0 0 0 3px rgba(0,74,173,0.1);
    }

    button {
      width: 100%;
      padding: 0.875rem;
      background: #004aad;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: #003380;
      transform: translateY(-2px);
    }

    .error {
      color: #dc2626;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      text-align: center;
    }

    .success {
      color: #10b981;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      text-align: center;
    }

    .input-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2><i class="fas fa-user-check"></i> Complete Registration</h2>
    <div class="subtitle">Create your admin account</div>

    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullName" required placeholder="Juan Dela Cruz">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" readonly style="background: #f1f5f9;">
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" required placeholder="Create a password (min. 6 characters)">
          <i class="fas fa-eye-slash password-toggle" id="togglePassword"></i>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" required placeholder="Confirm your password">
        </div>
      </div>

      <button type="submit">
        <i class="fas fa-check-circle"></i> Complete Registration
      </button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    const supabaseUrl = 'https://ircbidpdgkezxnszzeuu.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlyY2JpZHBkZ2tlenhuc3p6ZXV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MjQ1ODYsImV4cCI6MjA5MjIwMDU4Nn0.OkLuJsyIx1a3AsIb9w7KWEDlyIJfWjQJ9O_fN5KoSMw';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const email = decodeURIComponent(urlParams.get('email') || '');
    const role = urlParams.get('role') || 'admin';

    // Set email field
    document.getElementById('email').value = email;

    // Show message function
    function showMessage(msg, type) {
      const msgDiv = document.getElementById('message');
      msgDiv.innerHTML = `<div class="${type}">${msg}</div>`;
      setTimeout(() => {
        msgDiv.innerHTML = '';
      }, 5000);
    }

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.classList.toggle('fa-eye');
      this.classList.toggle('fa-eye-slash');
    });

    // Handle registration
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!fullName) {
        showMessage('Please enter your full name', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showMessage('Passwords do not match', 'error');
        return;
      }

      if (password.length < 6) {
        showMessage('Password must be at least 6 characters', 'error');
        return;
      }

      // Show loading
      const submitBtn = document.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Creating account...';
      submitBtn.disabled = true;

      try {
        // Create user in Supabase Auth
        const { data: authData, error: authError } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: fullName,
              role: role
            }
          }
        });

        if (authError) throw authError;

        // Add to admin_users table
        const { error: adminError } = await supabase
          .from('admin_users')
          .insert({
            id: authData.user.id,
            email: email,
            full_name: fullName,
            role: role,
            is_active: true
          });

        if (adminError) throw adminError;

        // Mark invite as used
        await supabase
          .from('admin_invites')
          .update({ used: true })
          .eq('token', token);

        showMessage('Account created successfully! Redirecting to login...', 'success');

        setTimeout(() => {
          window.location.href = '../index.html';
        }, 2000);

      } catch (error) {
        console.error('Registration error:', error);
        showMessage(error.message || 'Registration failed. Please try again.', 'error');
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
